aid: zanskar
name: Zanskar
description: 'Zanskar (Zanskar Geothermal & Minerals, Inc.) is a Salt Lake City-based
  geothermal energy company founded in 2021 by Carl Hoiland and Joel Edwards. It uses
  custom artificial intelligence, machine learning, and subsurface geoscience to discover
  and develop conventional geothermal resources, with a mission to make geothermal
  the most affordable form of widely-deployable, 24/7 carbon-free power. The company
  raised a $115M Series C and is backed by Obvious Ventures and Union Square Ventures.
  Zanskar publishes public geothermal datasets on the Snowflake Marketplace; it does
  not currently expose a public developer API.'
